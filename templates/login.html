<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Study Quest</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B0%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #070b0a;
            --card-bg: #111614;
            --card-border: rgba(255, 90, 0, 0.28);
            --orange: #ff5a00;
            --purple: #9b1cff;
            --text-main: #ffffff;
            --text-muted: #8b9290;
            --input-bg: #0b0f0d;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --nav-bg: rgba(7, 11, 10, 0.85);
        }

        [data-theme="light"] {
            --bg-dark: #faf8f5;
            --card-bg: #ffffff;
            --card-border: rgba(20, 22, 21, 0.08);
            --text-main: #141615;
            --text-muted: #5e6664;
            --input-bg: #f0eeeb;
            --border-subtle: rgba(20, 22, 21, 0.08);
            --nav-bg: rgba(250, 248, 245, 0.90);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .background-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(var(--border-subtle) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px),
                radial-gradient(circle at 10% 20%, rgba(255, 90, 0, 0.08), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(155, 28, 255, 0.12), transparent 35%);
            background-size: 32px 32px, 32px 32px, auto, auto;
            z-index: -1;
            pointer-events: none;
        }

        .login-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 40px;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-family: 'Bowlby One SC', sans-serif;
            font-size: 16px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: var(--orange);
            border-radius: 4px;
            display: grid;
            place-items: center;
            color: #fff;
        }

        .nav-right { display: flex; align-items: center; gap: 16px; }

        .theme-button {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 4px;
            cursor: pointer;
            display: grid;
            place-items: center;
            font-size: 15px;
        }

        .back-home {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
        }

        .login-wrapper {
            flex: 1;
            max-width: 1240px;
            width: 100%;
            margin: 0 auto;
            padding: 60px 40px;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 60px;
            align-items: start;
        }

        .intro-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(255, 90, 0, 0.1);
            border: 1px solid rgba(255, 90, 0, 0.2);
            color: var(--orange);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
            margin-bottom: 24px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
        }

        .hero-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(52px, 5.5vw, 76px);
            font-weight: 900;
            line-height: 0.88;
            letter-spacing: -2px;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        .hero-title .accent-orange {
            color: var(--orange);
            text-shadow: 3px 3px 0 var(--purple);
        }

        .intro-text {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            max-width: 520px;
            margin-bottom: 36px;
        }

        .intro-features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .mini-feature {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            padding: 16px 14px;
            border-radius: 4px;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 36px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--orange), var(--purple));
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
        }

        .auth-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 26px;
        }

        .auth-mark {
            width: 44px;
            height: 44px;
            background: var(--orange);
            color: #fff;
            font-weight: 900;
            font-size: 16px;
            display: grid;
            place-items: center;
            border-radius: 4px;
            font-family: 'Bowlby One SC', sans-serif;
        }

        .social-button {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .divider {
            text-align: center;
            position: relative;
            margin: 20px 0;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-subtle);
        }

        .divider span {
            position: relative;
            background: var(--card-bg);
            padding: 0 10px;
            font-size: 9px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .form-group input:focus { border-color: var(--orange); }

        .main-auth-button {
            width: 100%;
            padding: 14px;
            background: var(--orange);
            border: none;
            border-radius: 4px;
            color: #fff;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .signup-switch {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 18px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .signup-switch button {
            background: transparent;
            border: none;
            color: var(--orange);
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-message {
            margin-top: 12px;
            font-size: 12px;
            text-align: center;
            font-weight: 600;
        }
        .auth-message.error { color: #ef4444; }
        .auth-message.success { color: #10b981; }

        @media (max-width: 950px) {
            .login-wrapper { grid-template-columns: 1fr; padding: 30px 20px; gap: 30px; }
            .intro-features { grid-template-columns: 1fr; }
        }
    </style>
<style>
html{scroll-behavior:smooth}body{overflow-x:hidden}.auth-card{border-radius:22px!important;box-shadow:0 28px 90px rgba(25,12,5,.18)!important;overflow:hidden}.auth-card input,.auth-card button{border-radius:12px!important}.auth-card button,.theme-button,a{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.auth-card button:hover,.theme-button:hover{transform:translateY(-2px)}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid rgba(255,90,0,.28);outline-offset:2px}[data-theme="dark"] .auth-card{box-shadow:0 28px 90px rgba(0,0,0,.48)!important}@media(max-width:760px){.login-wrapper{padding:22px!important}.auth-card{border-radius:17px!important}.hero-title{font-size:clamp(42px,14vw,72px)!important}}
@media(max-width:760px){.login-nav{height:64px!important;padding:0 14px!important;gap:8px!important}.brand{min-width:0!important;font-size:13px!important;gap:8px!important}.brand-icon{width:34px!important;height:34px!important;flex:0 0 34px!important}.nav-right{gap:6px!important}.back-home{font-size:0!important;padding:9px!important}.back-home:before{content:"←";font-size:18px}.login-wrapper{display:block!important;padding:28px 18px 48px!important}.login-intro,.auth-section{width:100%!important;max-width:100%!important}.hero-title{font-size:clamp(40px,13.2vw,58px)!important;line-height:.91!important}.intro-text{font-size:15px!important}.auth-card{margin-top:34px!important;width:100%!important;padding:26px 20px!important}}
</style></head>
<body>

    <div class="background-grid"></div>

    <header class="login-nav">
        <a href="/" class="brand">
            <div class="brand-icon">🐰</div>
            <span>STUDY QUEST</span>
        </a>
        <div class="nav-right">
            <button id="themeToggle" class="theme-button" type="button">☀️</button>
            <a href="/" class="back-home">← Back to home</a>
        </div>
    </header>

    <main class="login-wrapper">

        <section class="login-intro">
            <div class="intro-label">
                <span class="status-dot"></span> THE AI LEARNING WORKSPACE
            </div>
            <h1 class="hero-title">
                YOUR<br>
                <span class="accent-orange">STUDY</span><br>
                SYSTEM<br>STARTS<br>HERE.
            </h1>
            <p class="intro-text">
                Sign in to unlock your personalized study workspace, AI-powered notes, focus sessions, and progress tracking.
            </p>
        </section>

        <section class="auth-section">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-mark">SQ</div>
                    <div>
                        <h2 id="authTitle">Welcome back.</h2>
                        <p id="authSubtitle">Log in to continue your quest.</p>
                    </div>
                </div>

                <button id="googleLogin" class="social-button" type="button">
                    <strong style="color:#4285f4;">G</strong> Continue with Google
                </button>

                <div class="divider">
                    <span>OR CONTINUE WITH EMAIL</span>
                </div>

                <form id="authForm">
                    <div class="form-group">
                        <label for="email">EMAIL ADDRESS</label>
                        <input id="email" type="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">PASSWORD</label>
                        <input id="password" type="password" placeholder="••••••••" minlength="6" required>
                    </div>

                    <button id="authSubmit" class="main-auth-button" type="submit">
                        LOG IN →
                    </button>
                </form>

                <div class="signup-switch">
                    <span id="switchText">Don't have an account?</span>
                    <button id="switchAuth" type="button">CREATE ACCOUNT</button>
                </div>

                <div id="authMessage" class="auth-message"></div>
            </div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider 
        } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDi4lBmRvz0ukS2033-Bhn2X8gymEGeq0g",
            authDomain: "study-verse-105d7.firebaseapp.com",
            projectId: "study-verse-105d7",
            storageBucket: "study-verse-105d7.firebasestorage.app",
            messagingSenderId: "991792725684",
            appId: "1:991792725684:web:a1f9312b55ede1b2b6a1e1",
            measurementId: "G-6X8J941C7P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('sq_theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const cur = document.body.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            localStorage.setItem('sq_theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        });

        // Form elements
        const authForm = document.getElementById('authForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const authSubmit = document.getElementById('authSubmit');
        const switchAuth = document.getElementById('switchAuth');
        const switchText = document.getElementById('switchText');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const authMessage = document.getElementById('authMessage');
        const googleLogin = document.getElementById('googleLogin');

        let isSignup = false;

        function showMessage(msg, isError = true) {
            authMessage.textContent = msg;
            authMessage.className = `auth-message ${isError ? 'error' : 'success'}`;
        }

        function friendlyAuthError(err) {
            const code = err?.code || '';
            const messages = {
                'auth/invalid-credential': 'The email or password is incorrect.',
                'auth/invalid-email': 'Please enter a valid email address.',
                'auth/email-already-in-use': 'An account already exists with this email.',
                'auth/weak-password': 'Use a stronger password with at least 6 characters.',
                'auth/popup-closed-by-user': 'Google sign-in was cancelled.',
                'auth/popup-blocked': 'Please allow the Google sign-in popup and try again.',
                'auth/network-request-failed': 'Network unavailable. Check your connection and try again.',
                'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.'
            };
            return messages[code] || 'Sign-in could not be completed. Please try again.';
        }

        function redirectUser(user, forceOnboarding = false) {
            const hasProfile = user && localStorage.getItem(`study_quest_profile_${user.uid}`);
            if (forceOnboarding || !hasProfile) {
                window.location.href = '/onboarding';
            } else {
                window.location.href = '/dashboard';
            }
        }

        switchAuth.addEventListener('click', () => {
            isSignup = !isSignup;
            authMessage.textContent = '';
            if (isSignup) {
                authTitle.textContent = 'Create Account';
                authSubtitle.textContent = 'Start your Study Quest journey today.';
                authSubmit.textContent = 'CREATE ACCOUNT →';
                switchText.textContent = 'Already have an account?';
                switchAuth.textContent = 'LOG IN';
            } else {
                authTitle.textContent = 'Welcome back.';
                authSubtitle.textContent = 'Log in to continue your quest.';
                authSubmit.textContent = 'LOG IN →';
                switchText.textContent = "Don't have an account?";
                switchAuth.textContent = 'CREATE ACCOUNT';
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            authSubmit.disabled = true;
            authSubmit.textContent = 'PROCESSING...';
            authMessage.textContent = '';

            try {
                if (isSignup) {
                    const credential = await createUserWithEmailAndPassword(auth, email, password);
                    showMessage('Account created successfully! Redirecting...', false);
                    setTimeout(() => redirectUser(credential.user, true), 600);
                } else {
                    const credential = await signInWithEmailAndPassword(auth, email, password);
                    showMessage('Logged in! Redirecting...', false);
                    setTimeout(() => redirectUser(credential.user, false), 600);
                }
            } catch (err) {
                authSubmit.disabled = false;
                authSubmit.textContent = isSignup ? 'CREATE ACCOUNT →' : 'LOG IN →';
                showMessage(friendlyAuthError(err), true);
            }
        });

        googleLogin.addEventListener('click', async () => {
            try {
                const credential = await signInWithPopup(auth, googleProvider);
                redirectUser(credential.user, false);
            } catch (err) {
                showMessage(friendlyAuthError(err), true);
            }
        });
    </script>
</body>
</html>
